name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A newer push to the same branch supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Style and build on Linux first: cheap, and the Windows runner is not spent on code that fails here.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Check formatting and code style
        run: dotnet format KeePassAutomation.sln --verify-no-changes

  ui-tests:
    needs: lint
    runs-on: windows-latest
    # A hang on an unexpected dialog would otherwise hold the runner for 6 hours.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # SDK 10 builds (pinned by global.json); the tests run on .NET 8.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Keyed on the fetch script, so bumping the version there is the whole change.
      - name: Cache KeePass
        uses: actions/cache@v6
        with:
          path: .keepass
          key: keepass-${{ hashFiles('tools/Get-KeePass.ps1', 'tools/Install-PinnedZip.ps1') }}

      - name: Fetch KeePass
        run: pwsh tools/Get-KeePass.ps1

      - name: Cache FFmpeg
        uses: actions/cache@v6
        with:
          path: .ffmpeg
          key: ffmpeg-${{ hashFiles('tools/Get-FFmpeg.ps1', 'tools/Install-PinnedZip.ps1') }}

      - name: Fetch FFmpeg
        run: pwsh tools/Get-FFmpeg.ps1

      - name: Build
        run: dotnet build KeePassAutomation.sln --configuration Release

      # The hang timeout names and stops a stuck test instead of timing out the whole job.
      - name: Run UI tests
        run: >
          dotnet test KeePassAutomation.sln
          --configuration Release
          --no-build
          --blame-hang-timeout 5m
          --blame-hang-dump-type none

      # Every test names its requirement, so coverage is read from the results. Runs even if tests
      # failed, and fails the job if a requirement has no test or there are no results to check.
      - name: Check every requirement has a test
        if: always()
        run: >
          pwsh tools/Test-RequirementCoverage.ps1
          requirements.json
          tests/KeePassAutomation.Tests/bin/Release/net8.0-windows/allure-results

      # The Trend widget needs the previous report's history, which the published report has.
      # A first run, or a run on a fork, simply has no history yet.
      - name: Fetch the previous report's history
        if: always()
        run: |
          $history = "tests/KeePassAutomation.Tests/bin/Release/net8.0-windows/allure-results/history"
          New-Item -ItemType Directory -Force $history | Out-Null
          foreach ($file in "history.json", "history-trend.json", "duration-trend.json", "categories-trend.json", "retry-trend.json") {
            try { Invoke-WebRequest "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history/$file" -OutFile "$history/$file" }
            catch { Write-Host "No previous $file" }
          }

      # Without this a point on the trend is an unlabelled bar; with it, it says which run it was.
      - name: Name the run in the report
        if: always()
        run: |
          $results = "tests/KeePassAutomation.Tests/bin/Release/net8.0-windows/allure-results"
          New-Item -ItemType Directory -Force $results | Out-Null
          @{
            name = "GitHub Actions"
            type = "github"
            buildName = "${{ github.workflow }} #${{ github.run_number }}"
            buildUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            reportUrl = "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          } | ConvertTo-Json | Set-Content "$results/executor.json"

      # The report holds every test with its requirement, video, and on failure the screenshot
      # and UIA tree. Generated even when tests failed, which is when it is needed.
      - name: Generate the Allure report
        if: always()
        run: |
          npm install --global allure-commandline@2.43.0
          allure generate tests/KeePassAutomation.Tests/bin/Release/net8.0-windows/allure-results --clean --output allure-report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report

      # The raw files behind the report, in case the report itself is what failed.
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence
          path: "**/artifacts/**"
          if-no-files-found: ignore

  # The report for main goes to GitHub Pages. The deploy action uploads the files directly, so
  # publishing makes no commit. It runs even when tests failed: that is when the report matters.
  publish-report:
    needs: ui-tests
    if: always() && github.ref == 'refs/heads/main' && needs.ui-tests.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: allure-report
          path: allure-report

      - uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

      - id: deploy
        uses: actions/deploy-pages@v5
