name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A new push cancels the run still going on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting is checked on Linux first, before the slower Windows job starts.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Check formatting and code style
        run: dotnet format KeePassAutomation.sln --verify-no-changes

  ui-tests:
    needs: lint
    runs-on: windows-latest
    # issues: read lets the coverage check read the requirement issues.
    permissions:
      contents: read
      issues: read
    # Stops a run stuck on an unexpected dialog.
    timeout-minutes: 15
    env:
      RESULTS: tests/KeePassAutomation.Tests/bin/Release/net8.0-windows/allure-results
      REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

    steps:
      - uses: actions/checkout@v7

      # SDK 10 builds; the tests run on .NET 8.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Downloaded again only when a fetch script changes.
      - name: Cache KeePass and FFmpeg
        uses: actions/cache@v6
        with:
          path: |
            .keepass
            .ffmpeg
          key: tools-${{ hashFiles('tools/Get-*.ps1', 'tools/Install-PinnedZip.ps1') }}

      - name: Fetch KeePass and FFmpeg
        run: |
          ./tools/Get-KeePass.ps1
          ./tools/Get-FFmpeg.ps1

      - name: Build
        run: dotnet build KeePassAutomation.sln --configuration Release

      # Stops a stuck test and names it.
      - name: Run UI tests
        run: >
          dotnet test KeePassAutomation.sln
          --configuration Release
          --no-build
          --blame-hang-timeout 5m
          --blame-hang-dump-type none

      # The steps below run even when tests fail, which is when they matter most.
      - name: Check every requirement has a test
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: pwsh tools/Test-RequirementCoverage.ps1 -Repository ${{ github.repository }} -ResultsDirectory $env:RESULTS

      - name: Prepare the report
        if: always()
        run: pwsh tools/Prepare-AllureReport.ps1 -ResultsDirectory $env:RESULTS -ReportUrl $env:REPORT_URL

      - name: Generate the Allure report
        if: always()
        run: |
          npm install --global allure-commandline@2.43.0
          allure generate $env:RESULTS --clean --output allure-report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report

      # The raw videos, screenshots and UIA trees, in case the report itself failed.
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence
          path: "**/artifacts/**"
          if-no-files-found: ignore

  # Publishes main's report to GitHub Pages, even when tests failed, without making a commit.
  publish-report:
    needs: ui-tests
    if: always() && github.ref == 'refs/heads/main' && needs.ui-tests.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: allure-report
          path: allure-report

      - uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

      - id: deploy
        uses: actions/deploy-pages@v5
