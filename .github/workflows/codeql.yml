name: codeql

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly, so new queries also check code that hasn't changed.
    - cron: '0 6 * * 1'

jobs:
  analyze:
    # Builds on Linux via EnableWindowsTargeting; a static scan needs nothing from Windows.
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual

      - name: Build
        run: dotnet build KeePassAutomation.sln --configuration Release

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:csharp
