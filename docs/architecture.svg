<svg xmlns="http://www.w3.org/2000/svg" width="900" height="690" viewBox="0 0 900 690" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="900" height="690" fill="#ffffff"/>

  <!-- TESTS -->
  <rect x="40" y="36" width="820" height="140" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="64" y="66" font-size="13" font-weight="700" letter-spacing="1.2" fill="#2563eb">TESTS</text>
  <text x="836" y="66" font-size="12.5" fill="#94a3b8" text-anchor="end">tests/KeePassAutomation.Tests</text>
  <line x1="64" y1="80" x2="836" y2="80" stroke="#e2e8f0"/>
  <text x="64" y="106" font-size="13.5" font-weight="700" fill="#1a202c">Scenarios/</text>
  <text x="180" y="106" font-size="13.5" fill="#334155">one class per window; the test lists every click and typed field</text>
  <text x="64" y="132" font-size="13.5" font-weight="700" fill="#1a202c">Setup/</text>
  <text x="180" y="132" font-size="13.5" fill="#334155">BaseTest starts and stops KeePass · TestConfig holds the settings · Evidence records the run</text>
  <text x="64" y="158" font-size="13.5" font-weight="700" fill="#1a202c">TestData/</text>
  <text x="180" y="158" font-size="13.5" fill="#334155">DatabaseTestData makes a database of the test's own, through the UI</text>

  <line x1="450" y1="176" x2="450" y2="216" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="462" y="200" font-size="12" fill="#94a3b8">references</text>

  <!-- SCREENS -->
  <rect x="40" y="216" width="820" height="140" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="64" y="246" font-size="13" font-weight="700" letter-spacing="1.2" fill="#2563eb">SCREENS</text>
  <text x="836" y="246" font-size="12.5" fill="#60a5fa" text-anchor="end">src/…/Screens · the only place an automation id appears</text>
  <line x1="64" y1="260" x2="836" y2="260" stroke="#bfdbfe"/>
  <text x="64" y="288" font-size="13.5" fill="#1a202c">MainWindow · FileDialog · CreateMasterKeyDialog · DatabaseSettingsDialog</text>
  <text x="64" y="312" font-size="13.5" fill="#1a202c">OpenDatabaseDialog · EntryDialog · EntryViewer · FindDialog</text>
  <text x="64" y="338" font-size="12.5" fill="#475569">Each finds its own window by title, declares its controls, and has one method per action.</text>

  <line x1="450" y1="356" x2="450" y2="396" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="462" y="380" font-size="12" fill="#94a3b8">references · never the other way round</text>

  <!-- FRAMEWORK -->
  <rect x="40" y="396" width="820" height="152" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="64" y="426" font-size="13" font-weight="700" letter-spacing="1.2" fill="#2563eb">FRAMEWORK</text>
  <text x="836" y="426" font-size="12.5" fill="#94a3b8" text-anchor="end">src/…/Framework · knows nothing about KeePass</text>
  <line x1="64" y1="440" x2="836" y2="440" stroke="#e2e8f0"/>
  <text x="64" y="466" font-size="13.5" font-weight="700" fill="#1a202c">Core</text>
  <text x="180" y="466" font-size="13.5" fill="#334155">ScreenObject · Element · Waits · ElementNotFoundException</text>
  <text x="64" y="492" font-size="13.5" font-weight="700" fill="#1a202c">AppUnderTest</text>
  <text x="180" y="492" font-size="13.5" fill="#334155">AppSession: launch, bring to front, close</text>
  <text x="64" y="518" font-size="13.5" font-weight="700" fill="#1a202c">Diagnostics</text>
  <text x="180" y="518" font-size="13.5" fill="#334155">TestRecording · Screenshots · UiaTreeDump</text>

  <line x1="450" y1="548" x2="450" y2="588" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="462" y="572" font-size="12" fill="#94a3b8">drives</text>

  <!-- Driver -->
  <rect x="40" y="588" width="820" height="46" rx="6" fill="#1e293b"/>
  <text x="450" y="617" font-size="13.5" font-weight="700" fill="#f8fafc" text-anchor="middle">FlaUI (UIA3)   →   Windows UI Automation   →   KeePass.exe</text>

  <rect x="40" y="655" width="3" height="18" fill="#2563eb"/>
  <text x="56" y="669" font-size="12.5" fill="#475569">A test may name visible text, a button caption or a dialog title, but never an automation id.</text>
</svg>
